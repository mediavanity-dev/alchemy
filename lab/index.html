<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <title>Alchemy Lab</title>
  <style>
    :root {
      --bg: #120f1a; --surface: #1e1929; --surface-2: #2a2337; --line: rgba(255,255,255,0.08);
      --text: #f3eee2; --muted: #a8a1b6; --faint: #716a82;
      --gold: #e5bc63; --gold-ink: #1f1606; --violet: #a99bff; --rose: #ff8796; --ok: #7fd8a6;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f7f3ea; --surface: #fffdf8; --surface-2: #efe8da; --line: rgba(40,28,60,0.1);
        --text: #1d1828; --muted: #665f74; --faint: #9a93a8;
        --gold: #b8862b; --gold-ink: #fffaf0; --violet: #6b5bd6; --rose: #d03e55; --ok: #2f9c64;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font: 16px/1.4 var(--font);
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
      padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 20px; font-weight: 650; }
    h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    .btn {
      background: var(--surface-2); border-radius: 12px; padding: 9px 14px; font-weight: 550; font-size: 15px;
    }
    .btn.primary { background: var(--gold); color: var(--gold-ink); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .cat {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px;
      text-align: left; display: flex; flex-direction: column; gap: 4px;
    }
    .cat.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
    .cat .name { font-weight: 600; font-size: 14px; }
    .cat .dots { display: flex; gap: 3px; flex-wrap: wrap; }
    .cat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); }
    .cat .dot.on { background: var(--ok); }
    .cat .kind { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .card h2 { font-size: 18px; }
    .hint { color: var(--muted); font-size: 15px; }
    .prompt {
      background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .prompt .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .prompt .title { font-weight: 600; }
    .prompt .meta { color: var(--muted); font-size: 13px; }
    .chords { display: flex; gap: 8px; flex-wrap: wrap; }
    .chords span {
      font-size: 22px; font-weight: 650; background: var(--surface); border-radius: 10px; padding: 4px 12px;
      min-width: 52px; text-align: center;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type=text] {
      width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px;
    }
    .recrow { display: flex; align-items: center; gap: 16px; }
    .rec {
      width: 84px; height: 84px; border-radius: 50%; background: var(--rose); flex: none;
      display: grid; place-items: center; box-shadow: 0 0 0 6px color-mix(in srgb, var(--rose) 20%, transparent);
    }
    .rec i { width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: border-radius 0.15s, width 0.15s, height 0.15s; }
    .rec.on i { border-radius: 6px; width: 26px; height: 26px; }
    .rec:disabled { opacity: 0.5; }
    .recinfo { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; }
    .meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
    .meter b { display: block; height: 100%; width: 0; background: var(--ok); transition: width 0.06s linear; }
    .status { color: var(--muted); font-size: 14px; min-height: 20px; }
    .clips { display: flex; flex-direction: column; gap: 6px; }
    .clip {
      display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 7px 10px;
      font-size: 14px;
    }
    .clip .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip .what em { color: var(--muted); font-style: normal; }
    .clip button { padding: 4px 8px; border-radius: 8px; color: var(--muted); }
    .clip button:hover { color: var(--text); background: var(--surface); }
    .foot { display: flex; flex-direction: column; gap: 8px; }
    .foot .actions { justify-content: space-between; align-items: center; }
    .small { font-size: 13px; color: var(--faint); }
    .empty { color: var(--faint); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Alchemy Lab <small id="total"></small></h1>
      <button class="btn primary" id="exportBtn">Export</button>
    </header>

    <p class="hint">Pick a type, record a few takes, then move on. Each take saves on this device until you export.</p>

    <div class="cats" id="cats"></div>

    <section class="card">
      <h2 id="catName"></h2>
      <p class="hint" id="catHint"></p>
      <div class="prompt" id="prompt" hidden></div>
      <input type="text" id="note" placeholder="Optional note (song name, key, instrument…)" autocomplete="off">
      <div class="recrow">
        <button class="rec" id="recBtn" aria-label="Record"><i></i></button>
        <div class="recinfo">
          <div class="timer" id="timer">0:00</div>
          <div class="meter"><b id="meter"></b></div>
          <div class="status" id="status">Tap to record, tap again to stop.</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Takes of this type</h2>
      <div class="clips" id="clips"></div>
    </section>

    <div class="foot">
      <div class="actions">
        <span class="small" id="size"></span>
        <button class="btn" id="clearBtn">Delete all</button>
      </div>
      <p class="small">Export makes one zip of every take (audio plus labels). Put it in the project's <code>testdata</code> folder.</p>
    </div>
  </div>
  <script type="module" src="lab.js"></script>
</body>
</html>
